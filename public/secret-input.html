<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodePath Secret</title>
    <link rel="stylesheet" href="./secret-input.css" />
  </head>
  <body>
    <main>
      <h1 id="title">CodePath Secret</h1>
      <p id="description"></p>
      <label>
        <span id="field-label">Secret</span>
        <input id="secret" type="password" autocomplete="off" spellcheck="false" autofocus />
      </label>
      <div class="actions">
        <button id="save" type="button">保存</button>
        <button id="clear" type="button">清除</button>
        <button id="cancel" type="button">取消</button>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script src="./secret-input.js"></script>
  </body>
</html>
