name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  repository_dispatch:
    types:
      - release

permissions:
  contents: read

jobs:
  build-extension:
    name: Build trusted release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.provenance.outputs.tag }}
      commit: ${{ steps.provenance.outputs.commit }}

    steps:
      - name: Checkout trusted release workflow
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated tag provenance from trusted main
        id: provenance
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Release tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi
          RELEASE_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main
          PACKAGE_VERSION="$(git show "$RELEASE_COMMIT:package.json" | node -e 'let source=""; process.stdin.on("data", chunk => source += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(source).version));')"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout verified release commit
        env:
          RELEASE_COMMIT: ${{ steps.provenance.outputs.commit }}
        run: git checkout --detach "$RELEASE_COMMIT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Check whitespace errors
        run: git diff --check

      - name: Zip Chrome/Edge extension
        run: |
          rm -f .output/*-chrome.zip
          npx wxt zip -b chrome

      - name: Prepare stable release asset
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const outputDir = ".output";
          const assets = fs
            .readdirSync(outputDir)
            .filter((name) => /^codepath-.+-chrome\.zip$/.test(name));
          if (assets.length !== 1) {
            throw new Error(`Expected exactly one Chrome extension zip in .output, found ${assets.length}`);
          }
          fs.copyFileSync(path.join(outputDir, assets[0]), "CodePath.zip");
          NODE

      - name: Upload verified release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codepath-release-${{ steps.provenance.outputs.tag }}
          path: CodePath.zip
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish approved GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: build-extension
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout trusted publish verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate tag after release approval
        env:
          RELEASE_TAG: ${{ needs.build-extension.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.build-extension.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Release tag is no longer annotated: $RELEASE_TAG" >&2
            exit 1
          fi
          CURRENT_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$CURRENT_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "Release tag moved after build: expected $EXPECTED_COMMIT, got $CURRENT_COMMIT" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$CURRENT_COMMIT" refs/remotes/origin/main

      - name: Download verified release asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codepath-release-${{ needs.build-extension.outputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.build-extension.outputs.tag }}
          target_commitish: ${{ needs.build-extension.outputs.commit }}
          files: CodePath.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
