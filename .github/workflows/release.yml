name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-extension:
    name: Release Chrome/Edge extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Fetch main for provenance verification
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify release provenance
        run: npm run verify:release

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Check whitespace errors
        run: git diff --check

      - name: Zip Chrome/Edge extension
        run: |
          rm -f .output/*-chrome.zip
          npx wxt zip -b chrome

      - name: Prepare stable release asset
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const outputDir = ".output";
          const assets = fs
            .readdirSync(outputDir)
            .filter((name) => /^codepath-.+-chrome\.zip$/.test(name));
          if (assets.length !== 1) {
            throw new Error(`Expected exactly one Chrome extension zip in .output, found ${assets.length}`);
          }
          fs.copyFileSync(path.join(outputDir, assets[0]), "CodePath.zip");
          NODE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: CodePath.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
