name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Type-check
        run: npm run compile

      - name: Build Chrome/Edge extension
        run: npm run build

      - name: Check whitespace errors
        run: git diff --check

      - name: Verify build version sync
        run: npm run verify:build-version

      - name: Verify MCP tool names
        run: npm run verify:mcp-tools

      - name: Scan for secrets and private paths
        run: npm run scan:secrets

      - name: Package Chrome/Edge extension
        run: |
          cd .output/chrome-mv3
          zip -r ../../codepath-chrome-mv3-${{ github.sha }}.zip .

      - name: Upload Chrome/Edge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codepath-chrome-mv3-${{ github.sha }}
          path: codepath-chrome-mv3-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
